<style>
.toc-box {
  background: #f7f8fb;
  border: 1px solid #e3e7f0;
  border-radius: 6px;
  padding: 12px 16px;
  margin: 12px 0 20px;
}
.toc-box .toc-title {
  margin: 0 0 8px;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  font-size: 0.95rem;
  color: #2c3e50;
}
.toc-box ul {
  margin: 0;
  padding-left: 18px;
}
.toc-box li {
  margin: 4px 0;
}
</style>

{%- assign toc_levels = include.toc_levels | default: "2..4" -%}
{::options toc_levels="{{ toc_levels }}"/}
<div class="toc-box" markdown="1">
**Table of Contents**
* Table of Contents
{:toc}
</div>
